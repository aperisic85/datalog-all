<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#863bff"/>
      <stop offset="100%" stop-color="#7e14ff"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#47bfff"/>
      <stop offset="100%" stop-color="#863bff"/>
    </linearGradient>
  </defs>

  <!-- Light rays -->
  <line x1="24" y1="2" x2="24" y2="6" stroke="#47bfff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16.5" y1="4.2" x2="18.8" y2="7.5" stroke="#47bfff" stroke-width="2" stroke-linecap="round"/>
  <line x1="31.5" y1="4.2" x2="29.2" y2="7.5" stroke="#47bfff" stroke-width="2" stroke-linecap="round"/>

  <!-- Lantern room -->
  <rect x="18" y="8" width="12" height="6" rx="1.5" fill="#47bfff"/>
  <rect x="20" y="9.5" width="8" height="3" rx="0.5" fill="rgba(255,255,255,0.4)"/>

  <!-- Tower body (tapered) -->
  <path d="M20 14 L17 38 L31 38 L28 14 Z" fill="url(#tower)"/>

  <!-- Tower stripes -->
  <rect x="17.7" y="21" width="12.6" height="3.5" rx="0" fill="rgba(255,255,255,0.12)"/>
  <rect x="17.2" y="30" width="13.6" height="3.5" rx="0" fill="rgba(255,255,255,0.12)"/>

  <!-- Base platform -->
  <rect x="14" y="38" width="20" height="4" rx="1.5" fill="#7e14ff"/>

  <!-- Waves -->
  <path d="M5 45.5 Q9 43 13 45.5 Q17 48 21 45.5 Q25 43 29 45.5 Q33 48 37 45.5 Q41 43 45 45.5" stroke="#47bfff" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
